<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Feedback | Organics Food</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="bar">
<a class="logo" href="index.html"><i></i>Organics Food</a>
<nav class="nav"><a href="index.html">Home</a><a href="about.html">About Us</a><a href="products.html">Products</a><a href="sales.html">Sales</a><a href="feedback.html" class="on" aria-current="page">Feedback</a><a href="contact.html">Contact Us</a></nav></div></header>
<main>
<section class="page on" id="feedback">
<h1>Feedback</h1>
<div class="split">
<div>
<h2>Tell us how we did</h2>
<form id="ffm">
<label>Your name<input name="n" required></label>
<label>Rating<select name="r"><option>5 – Loved it</option><option>4 – Good</option><option>3 – Okay</option><option>2 – Poor</option><option>1 – Bad</option></select></label>
<label>Your comments<textarea name="c" rows="4" required></textarea></label>
<button class="btn" type="submit">Send feedback</button>
<div class="msg" id="fmsg" role="status">Thank you. Your feedback now appears in the list.</div>
</form></div>
<div><h2>What customers say</h2><div id="reviews" style="display:grid;gap:14px"></div></div>
</div></section>
</main>
<footer>&copy; 2026 Organics Food. Grown clean, delivered fresh.</footer>
<script src="app.js"></script>
</body>
</html>
